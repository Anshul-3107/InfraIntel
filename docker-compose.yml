services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      INFRAINTEL_DB: postgres
      DB_HOST: db
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn infraintel.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 180"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/app/backend/media
      - ./ml/models/production:/app/ml/models/production:ro

volumes:
  pgdata:
  media: